<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:500;src:url(fonts/fredoka-latin-500-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:600;src:url(fonts/fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(fonts/fredoka-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#E6D7BC;font-family:Fredoka,'DejaVu Sans',sans-serif}
#content{position:absolute;left:0;top:0;width:720px;height:1280px;overflow:hidden;transform-origin:50% 50%}
#grain{position:absolute;left:-30px;top:-30px;pointer-events:none;mix-blend-mode:soft-light;opacity:1}
#grain2{position:absolute;left:-30px;top:-30px;pointer-events:none;mix-blend-mode:multiply;opacity:.5}
#light{position:absolute;left:0;top:0;width:720px;height:1280px;pointer-events:none;mix-blend-mode:multiply;
 background:radial-gradient(ellipse 85% 80% at 42% 38%,rgba(255,244,220,0) 55%,rgba(90,60,35,.32) 100%)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="r0" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<filter id="r1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<filter id="r2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
<!-- felt: soft wobble plus fine fiber fuzz on every edge -->
<filter id="felt0" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="3" result="a"/><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="f"/><feDisplacementMap in="a" in2="f" scale="4.5"/></filter>
<filter id="felt1" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="3" result="a"/><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="23" result="f"/><feDisplacementMap in="a" in2="f" scale="4.5"/></filter>
<filter id="felt2" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="13" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="3" result="a"/><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="37" result="f"/><feDisplacementMap in="a" in2="f" scale="4.5"/></filter>
</defs></svg>
<div id="content"></div>
<canvas id="grain" width="780" height="1340"></canvas>
<div id="light"></div>
<script src="scenes.js"></script>
</body></html>
